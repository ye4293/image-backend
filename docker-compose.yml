# 生产部署（默认配置）：外部托管数据库 + CI 构建好的后端镜像。
#
# 这是 `docker compose` 不带 -f 时的默认文件，所以服务器上部署只要：
#
#   cp .env.prod.example .env      # 注意名字是 .env，不是 .env.prod
#   vim .env                       # 填好每一项，DATABASE_URL 见下
#   docker compose up -d
#   docker compose logs -f backend
#
# **env 文件在服务器上要命名为 `.env`**：compose 不带 --env-file 时自动读它。
# 叫 .env.prod 也可以，但每条命令都得跟 `--env-file .env.prod`，敲漏一次就会用
# 空值启动——那时后端会退化成临时 SQLite，服务照常跑但重启丢全部数据。
# .env 与 .env.prod 都在 .gitignore 里，不会被提交。
#
# 更新（发新 tag 之后）：
#   git pull && docker compose pull && docker compose up -d
#
# 回滚到指定版本，不用改本文件：
#   MOLOOM_TAG=v0.1.0 docker compose up -d
#
# 另外两份 compose：
#   docker-compose.with-postgres.yml  生产，但自带一个 Postgres 容器（不用托管数据库）
#   docker-compose.dev.yml            本地开发，只起 Postgres，不含后端
#
# TLS 与反代由宿主机 nginx 负责（配置见 deploy/nginx.conf.example）。
# 完整部署流程见 deploy/DEPLOY.md。
#
# ⚠️ 后端只支持 Postgres 与 SQLite，**不支持 MySQL**。
#    DATABASE_URL 必须以 postgres:// 或 postgresql:// 开头，否则会被当成 SQLite
#    文件路径——而那个失败长得像 "unable to open database file: out of memory"，
#    完全指不到真正的原因。
#
# DATABASE_URL 填写格式（PostgreSQL）：
#   postgres://用户名:密码@主机:5432/库名?sslmode=require
#
# 例（阿里云 RDS / PolarDB）：
#   postgres://用户:你的密码@pgm-xxxx.pg.rds.aliyuncs.com:5432/库名?sslmode=require
#
# 密码里若含 @ : / ? # 等字符，必须按 URL 编码转义（@ → %40，# → %23）。
# 忘了转义的表现是 "认证失败" 或 "库不存在"，而不是 "URL 格式错误"。
#
# sslmode：托管实例默认关 TLS 的情况很常见（阿里云 PolarDB 出厂就是 ssl=off），
# 那时填 require 会被服务端直接拒绝、启动即失败。走公网请先在控制台开 SSL。

services:
  backend:
    # 用 CI 构建好的镜像，服务器上不再编译（见 .github/workflows/docker-image.yml）。
    #
    # MOLOOM_TAG 留空就是 latest。回滚时把它设成某次提交的短 sha 即可，**不用改本
    # 文件**——latest 会被下一次 push 覆盖，出事时需要一个能指回"上一个已知好版本"
    # 的办法，而 CI 对每次提交都额外打了一份 <sha> tag：
    #     MOLOOM_TAG=a1b2c3d docker compose up -d
    #
    # 要改回在服务器上从源码构建（例如调试一个还没推的改动），把下面这行换成
    # `build: .` 并加 --build 即可。
    image: ye4293xx7/moloom:${MOLOOM_TAG:-latest}
    # 挡住"忘了先 pull 就 up -d"这个静默失败：latest 是可变 tag，本地有缓存时
    # up -d 会拿旧镜像起来且**没有任何提示**，看起来部署成功了其实没换代码。
    #
    # 代价是 up -d 需要能连上 registry。重启不受影响（restart: unless-stopped 由
    # docker 守护进程直接拉起已有容器，不走 pull），只有手工 up -d 时会因断网而失败
    # ——而那是显式报错，比静默用旧镜像好。
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8080"
      # 外部数据库：整串由 .env.prod 提供，compose 不再拼装
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      # 加密 app_settings 里 secret 项的主密钥。**缺了会拒绝启动**——解不开的
      # 密文等于所有上游凭据失效，那时起来只会以「上游认证失败」误导排查。
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      # ---- 以下四项只在 app_settings 表里还没有该项时被读取一次（播种）----
      # 之后一律以数据库为准，请在 /admin/settings 修改；改这里不再生效。
      FLUX_API_KEY: ${FLUX_API_KEY:-}
      EZLINKAI_BASE_URL: ${EZLINKAI_BASE_URL:-https://api.ezlinkai.com}
      APP_BASE_URL: ${APP_BASE_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      # ---- Stripe 刻意留在环境变量，不进后台设置页 ----
      # 一年动不了一次，而它是唯一能直接动钱的凭据；放进库只是把它写进备份文件。
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # 用该邮箱注册后即成为管理员。库里已有管理员后此项自动失效。
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # ---- CORS：也留在环境变量，不进后台设置页 ----
      # 它是安全边界（谁可以跨域读这个 API），做成管理员可改等于给后台一个把
      # origin 改成 * 的开关；而且它要在启动期硬拦截，库里的值只能降级成告警。
      #
      # 前端与后端不同源时必填。漏填的表现是 curl 全通、浏览器全挂，
      # 反代日志里只有一串被拒的 OPTIONS（403）——没有任何信号指向缺 CORS。
      # 只支持精确匹配，不支持通配符（理由见 internal/config 的 validateOrigin）。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    # 只绑宿主机回环，由宿主 nginx 反代。
    # 绑 127.0.0.1 而非 0.0.0.0：后者会把 8080 直接暴露到公网，绕过 nginx。
    #
    # nginx 侧 **proxy_read_timeout 必须调到 300s**（默认 60 秒）：生成要挂
    # 25~35 秒、慢模型最长 3 分钟，不调会在快出图时给用户 504，而后端用的是
    # 脱离请求的 context——图照样出完、次数照样已扣。
    ports:
      - "127.0.0.1:8080:8080"
    # 生成要挂住连接。stop_grace_period 给足时间让进行中的生成跑完再退出；
    # 超时被强杀会留下卡在 processing 的行（下次启动的兜底扫描会退款，
    # 但用户白等一场）。
    stop_grace_period: 5m
