# 方案 A：使用外部托管数据库（阿里云 RDS PostgreSQL 等）
#
# 与仓库根目录的 docker-compose.prod.yml 的区别：**不起 postgres 容器**，
# 数据库用你自己的托管实例。TLS 与反代仍由宿主机 nginx 负责
# （配置见 deploy/nginx.conf.example）。
#
# 用法：
#   cp .env.prod.example .env.prod        # 填好每一项，DATABASE_URL 见下
#   docker compose -f docker-compose.external-db.yml --env-file .env.prod up -d --build
#
# ⚠️ 后端只支持 Postgres 与 SQLite，**不支持 MySQL**。
#    DATABASE_URL 必须以 postgres:// 或 postgresql:// 开头，否则会被当成 SQLite
#    文件路径——而那个失败长得像 "unable to open database file: out of memory"，
#    完全指不到真正的原因。
#
# DATABASE_URL 填写格式（PostgreSQL）：
#   postgres://用户名:密码@主机:5432/库名?sslmode=require
#
# 例（阿里云 RDS PostgreSQL）：
#   postgres://missapi:你的密码@pgm-xxxx.pg.rds.aliyuncs.com:5432/atsapi4?sslmode=require
#
# 密码里若含 @ : / ? # 等字符，必须按 URL 编码转义（@ → %40，# → %23）。
# 忘了转义的表现是 "认证失败" 或 "库不存在"，而不是 "URL 格式错误"。
#
# sslmode：阿里云 RDS 默认支持 TLS，用 require；只在内网直连且确认无需 TLS 时
# 才用 disable。

services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      # 外部数据库：整串由 .env.prod 提供，compose 不再拼装
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      # 加密 app_settings 里 secret 项的主密钥。**缺了会拒绝启动**——解不开的
      # 密文等于所有上游凭据失效，那时起来只会以「上游认证失败」误导排查。
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      # ---- 以下四项只在 app_settings 表里还没有该项时被读取一次（播种）----
      # 之后一律以数据库为准，请在 /admin/settings 修改；改这里不再生效。
      FLUX_API_KEY: ${FLUX_API_KEY:-}
      EZLINKAI_BASE_URL: ${EZLINKAI_BASE_URL:-https://api.ezlinkai.com}
      APP_BASE_URL: ${APP_BASE_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      # ---- Stripe 刻意留在环境变量，不进后台设置页 ----
      # 一年动不了一次，而它是唯一能直接动钱的凭据；放进库只是把它写进备份文件。
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # 用该邮箱注册后即成为管理员。库里已有管理员后此项自动失效。
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    # 只绑宿主机回环，由宿主 nginx 反代。
    # 绑 127.0.0.1 而非 0.0.0.0：后者会把 8080 直接暴露到公网，绕过 nginx。
    #
    # nginx 侧 **proxy_read_timeout 必须调到 300s**（默认 60 秒）：生成要挂
    # 25~35 秒、慢模型最长 3 分钟，不调会在快出图时给用户 504，而后端用的是
    # 脱离请求的 context——图照样出完、次数照样已扣。
    ports:
      - "127.0.0.1:8080:8080"
    # 生成要挂住连接。stop_grace_period 给足时间让进行中的生成跑完再退出；
    # 超时被强杀会留下卡在 processing 的行（下次启动的兜底扫描会退款，
    # 但用户白等一场）。
    stop_grace_period: 5m
